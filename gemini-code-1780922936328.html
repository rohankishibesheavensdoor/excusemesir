<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Projection Mapping App</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webcam {
            display: none; /* Hide raw video; we use it as a texture */
        }
        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5rem;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loading">Initializing Camera & AI Tracking...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas3d"></canvas>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas3d');
        const loadingElement = document.getElementById('loading');

        let scene, camera, renderer, videoTexture;
        let projectionMesh;
        let lastHandLandmarks = null;

        // --- 1. Initialize Three.js Scene ---
        function initThree() {
            scene = new THREE.Scene();
            
            // Camera setup matching screen aspect ratio
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Create Video Texture from the webcam
            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;

            // Custom Shader Material to replicate the stylized, thermal/halftone digital aesthetic
            const customMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    u_time: { value: 0 },
                    u_texture: { value: videoTexture }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D u_texture;
                    uniform float u_time;
                    varying vec2 vUv;

                    void main() {
                        vec4 texColor = texture2D(u_texture, vUv);
                        
                        // Calculate brightness (luminance)
                        float brightness = dot(texColor.rgb, vec3(0.299, 0.587, 0.114));
                        
                        // Stylized color palette mapping (Blue-Green-Yellow-Red aesthetic from video)
                        vec3 color = vec3(0.0);
                        if (brightness < 0.2) {
                            color = mix(vec3(0.0, 0.1, 0.5), vec3(0.0, 0.5, 0.7), brightness * 5.0); // Blues
                        } else if (brightness < 0.5) {
                            color = mix(vec3(0.0, 0.5, 0.7), vec3(0.1, 0.8, 0.2), (brightness - 0.2) * 3.33); // Greens
                        } else if (brightness < 0.8) {
                            color = mix(vec3(0.1, 0.8, 0.2), vec3(1.0, 0.9, 0.0), (brightness - 0.5) * 3.33); // Yellows
                        } else {
                            color = mix(vec3(1.0, 0.9, 0.0), vec3(0.9, 0.1, 0.1), (brightness - 0.8) * 5.0); // Reds
                        }

                        // Add a digital halftone/scanline overlay effect
                        float scanline = sin(vUv.y * 200.0 + u_time * 5.0) * 0.15;
                        color += scanline;

                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.DoubleSide
            });

            // Create a dynamic custom geometry for the geometric banner
            const geometry = new THREE.BufferGeometry();
            
            // 4 vertices setting up a 3D Quad/Trapezoid
            const vertices = new Float32Array([
                -1,  0.5, 0,  // Top Left (0)
                 1,  0.5, 0,  // Top Right (1)
                -1, -0.5, 0,  // Bottom Left (2)
                 1, -0.5, 0   // Bottom Right (3)
            ]);

            // Map UV coordinates perfectly across the polygon
            const uvs = new Float32Array([
                0, 1,
                1, 1,
                0, 0,
                1, 0
            ]);

            // Triangle indices
            const indices = [
                0, 2, 1,
                2, 3, 1
            ];

            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
            geometry.setIndex(indices);

            projectionMesh = new THREE.Mesh(geometry, customMaterial);
            scene.add(projectionMesh);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 2. Convert MediaPipe Normalized Coordinates to Three.js Space ---
        function mapTargetPoints(landmarks) {
            // Target the tips of both Index Fingers (Landmark 8)
            // Left hand index tip vs Right hand index tip
            if (landmarks.length < 1) {
                projectionMesh.visible = false;
                return;
            }

            projectionMesh.visible = true;

            let p1, p2;

            if (landmarks.length >= 2) {
                // Two hands detected
                p1 = landmarks[0][8]; // Hand 1 index tip
                p2 = landmarks[1][8]; // Hand 2 index tip
            } else {
                // One hand detected: Anchors between index tip (8) and wrist (0)
                p1 = landmarks[0][8];
                p2 = landmarks[0][0];
            }

            // Convert normalized screen coords (0 to 1) into Three.js 3D Viewport coordinates
            const convertCoord = (point) => {
                return {
                    x: (1 - point.x - 0.5) * 7, // Inverted X because webcam is mirrored
                    y: (0.5 - point.y) * 5,
                    z: -point.z * 5 // Depth simulation
                };
            };

            let pt1 = convertCoord(p1);
            let pt2 = convertCoord(p2);

            // Update mesh vertex positions dynamically based on tracked points
            const positions = projectionMesh.geometry.attributes.position.array;

            // Generate an interactive thick geometric banner spanning between the points
            const thickness = 0.8;

            // Top Left
            positions[0] = pt1.x;
            positions[1] = pt1.y + thickness;
            positions[2] = pt1.z;

            // Top Right
            positions[3] = pt2.x;
            positions[4] = pt2.y + thickness;
            positions[5] = pt2.z;

            // Bottom Left
            positions[6] = pt1.x;
            positions[7] = pt1.y - thickness;
            positions[8] = pt1.z;

            // Bottom Right
            positions[9] = pt2.x;
            positions[10] = pt2.y - thickness;
            positions[11] = pt2.z;

            projectionMesh.geometry.attributes.position.needsUpdate = true;
        }

        // --- 3. Setup MediaPipe Tracking ---
        function onResults(results) {
            if (loadingElement) {
                loadingElement.style.opacity = 0;
            }

            if (results.multiHandLandmarks) {
                mapTargetPoints(results.multiHandLandmarks);
            } else {
                projectionMesh.visible = false;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // --- 4. Initialize Camera & Core App Loop ---
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            
            if (projectionMesh && projectionMesh.material.uniforms) {
                projectionMesh.material.uniforms.u_time.value = clock.getElapsedTime();
            }
            
            renderer.render(scene, camera);
        }

        // Bootstrapping the application
        initThree();
        cameraUtils.start().catch(err => {
            loadingElement.innerText = "Camera Access Denied or Unavailable.";
            console.error(err);
        });
        animate();

    </script>
</body>
</html>
